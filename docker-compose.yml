version: '3.9'
services:
  accessweb-backend:
    build:
      context: ./backend
    container_name: accessweb-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - JWT_SECRET=change_this_super_secret_key
      - DB_PATH=/app/data/accessweb.db
      - CORS_ORIGIN=*
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
