services:
  - type: web
    name: accessweb-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: accessweb-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 8080
      - key: DB_PATH
        value: /opt/render/project/src/data/accessweb.db
      - key: ALLOWED_ORIGINS
        value: https://nikshukrem.github.io,http://localhost:8080
      - key: JWT_SECRET
        generateValue: true
